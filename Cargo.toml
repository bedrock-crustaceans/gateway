[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
bedrock = { git = "https://github.com/bedrock-crustaceans/bedrock-rs", features = ["full", "protocol-v975", "protocol-packet-dyn", "protocol-packet-meta", "auth-async"] }
tracing = "0.1.44"
egui = "0.34.1"
egui-phosphor = { version = "0.12.0", features = ["fill"] }
eframe = "0.34.1"
tokio = "1.52.1"
chrono = "0.4.44"
serde = "1.0.228"
serde_json = "1.0.149"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto", "p384"] }
base64 = "0.22.1"
p384 = { version = "0.14.0-rc.8", features = ["ecdh", "ecdsa"] }